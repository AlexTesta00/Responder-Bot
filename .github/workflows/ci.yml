name: CI

on:
  # develop only receives fast-forwards of commits already verified on a
  # sprint branch, so pushes to it do not need another run.
  push:
    branches: [main, "sprint/**"]
  pull_request:
    branches: [main, develop]

# The pipeline only reads the repository and needs no application secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned OS images: move them forward deliberately, never via -latest.
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
