name: CI

on:
  # develop only receives fast-forwards of commits already verified on a
  # sprint branch, so pushes to it do not need another run.
  push:
    branches: [main, "sprint/**"]
  pull_request:
    branches: [main, develop]

# The pipeline only reads the repository and needs no application secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Pinned OS images: move them forward deliberately, never via -latest.
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  database:
    name: Database tests (${{ matrix.database }})
    strategy:
      fail-fast: false
      matrix:
        # Hostinger runs MariaDB; MySQL covers databases created as MySQL.
        database: ["mariadb:10.11", "mysql:8.4"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: ${{ matrix.database }}
        env:
          # Both images read the MYSQL_ variables.
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest || mariadb-admin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      # Enables the tests that need a database server.
      TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/responder_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
